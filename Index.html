<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-income: #38bdf8;
            --accent-expense: #fb923c;
            --border-color: #334155;
            --input-bg: #0f172a;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 50px;
        }
        h2, h3 {
            font-weight: 600;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .month-selector {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .month-selector select {
            background: transparent;
            color: var(--text-color);
            border: none;
            font-size: 16px;
            outline: none;
            cursor: pointer;
            font-weight: 600;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }
        /* แดชบอร์ด 3 ช่อง */
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        @media(max-width: 768px) {
            .summary-grid { grid-template-columns: 1fr; }
        }
        .summary-box {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }
        .summary-box.income { border-left: 6px solid var(--accent-income); }
        .summary-box.expense { border-left: 6px solid var(--accent-expense); }
        .summary-box.balance { border-left: 6px solid #10b981; }
        .summary-box p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 4px;
        }
        .summary-box h3 {
            font-size: 20px;
            margin: 0;
            font-weight: 700;
        }
        .chart-container {
            position: relative;
            height: 160px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn {
            background-color: #334155;
            color: var(--text-color);
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .btn-primary { background-color: #38bdf8; color: #0f172a; }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media(max-width: 768px) {
            .form-grid, .split-container { grid-template-columns: 1fr !important; }
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }
        
        /* ฟิลเตอร์สถานะ */
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .filter-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        .filter-btn.active {
            background: var(--text-color);
            color: var(--bg-color);
            font-weight: 600;
        }

        /* แบ่งฝั่ง ซ้าย-ขวา */
        .split-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .column-box {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 300px;
        }
        .column-title-income { color: var(--accent-income); font-size: 18px; font-weight: 700; border-bottom: 2px solid var(--accent-income); padding-bottom: 8px; }
        .column-title-expense { color: var(--accent-expense); font-size: 18px; font-weight: 700; border-bottom: 2px solid var(--accent-expense); padding-bottom: 8px; }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .transaction-info h4 {
            font-size: 16px;
            margin-bottom: 2px;
        }
        .transaction-note {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .transaction-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }
        .amount-income { color: var(--accent-income); font-size: 18px; font-weight: 700; }
        .amount-expense { color: var(--accent-expense); font-size: 18px; font-weight: 700; }
        
        /* ปุ่มกดเปลี่ยนสถานะ */
        .status-btn {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .status-received { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #38bdf8; }
        .status-not-received { background: rgba(148, 163, 184, 0.1); color: #94a3b8; border: 1px solid #64748b; }
        .status-partial-received { background: rgba(129, 140, 248, 0.2); color: #818cf8; border: 1px solid #818cf8; }

        .status-paid { background: rgba(251, 146, 60, 0.2); color: #fb923c; border: 1px solid #fb923c; }
        .status-pending { background: rgba(148, 163, 184, 0.1); color: #94a3b8; border: 1px solid #64748b; }
        .status-partial { background: rgba(244, 63, 94, 0.2); color: #fb7185; border: 1px solid #fb7185; }

        .delete-btn {
            background: transparent;
            color: #ef4444;
            border: none;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 4px;
        }
        .tab-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
        }
        .tab-btn.active {
            background: var(--text-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>💰 Expense Tracker</h2>
        <div class="month-selector">
            <select id="currentMonthSelect" onchange="changeMonth()">
                <!-- JS เติมเดือน -->
            </select>
        </div>
    </div>

    <!-- แดชบอร์ดสรุป 3 ช่อง -->
    <div class="summary-grid">
        <div class="summary-box income">
            <p>รายรับรวม</p>
            <h3 id="totalIncome">0.00</h3>
        </div>
        <div class="summary-box balance">
            <p>คงเหลือสุทธิ</p>
            <h3 id="netBalance">0.00</h3>
        </div>
        <div class="summary-box expense">
            <p>รายจ่ายรวม</p>
            <h3 id="totalExpense">0.00</h3>
        </div>
    </div>

    <!-- กราฟวงกลม -->
    <div class="card" style="padding: 12px;">
        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <!-- ฟอร์มเพิ่มรายการ -->
    <div class="card">
        <h3 style="margin-bottom: 12px; font-size: 18px;">➕ เพิ่มรายการใหม่</h3>
        <div class="tab-buttons">
            <div class="tab-btn active" onclick="setFormType('expense')">รายจ่าย</div>
            <div class="tab-btn" onclick="setFormType('income')">รายรับ</div>
        </div>
        <form id="transactionForm" onsubmit="addTransaction(event)">
            <input type="hidden" id="formType" value="expense">
            <div class="form-grid">
                <div class="form-group">
                    <label>ชื่อรายการ</label>
                    <input type="text" id="title" class="form-control" placeholder="เช่น เงินเดือน, ค่าห้อง" required>
                </div>
                <div class="form-group">
                    <label>จำนวนเงิน (บาท)</label>
                    <input type="number" id="amount" class="form-control" step="0.01" placeholder="0.00" required>
                </div>
            </div>
            <div class="form-group">
                <label>หมายเหตุ (ถ้ามี)</label>
                <input type="text" id="note" class="form-control" placeholder="เช่น จ่ายผ่าน Mobile Banking">
            </div>
            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 15px;">
                    <input type="checkbox" id="isFixed" style="width: 18px; height: 18px;">
                    ตั้งเป็นรายการประจำ (คัดลอกไปเดือนใหม่อัตโนมัติ 🔁)
                </label>
            </div>
            <button type="submit" class="btn btn-primary">บันทึกรายการ</button>
        </form>
    </div>

    <!-- แบ่งฝั่ง ซ้าย-ขวา พร้อมฟิลเตอร์ -->
    <div class="card">
        <h3 style="margin-bottom: 12px; font-size: 18px;">📋 รายการแยกตามประเภท</h3>
        
        <!-- แถบฟิลเตอร์ -->
        <div class="filter-bar">
            <button class="filter-btn active" onclick="setFilter('all', this)">ทั้งหมด</button>
            <button class="filter-btn" onclick="setFilter('pending', this)">ยังไม่จ่าย/ยังไม่รับ</button>
            <button class="filter-btn" onclick="setFilter('completed', this)">จ่ายแล้ว/รับแล้ว</button>
            <button class="filter-btn" onclick="setFilter('partial', this)">จ่าย/รับไม่ครบ</button>
        </div>

        <div class="split-container">
            <!-- ฝั่งรายรับ -->
            <div class="column-box">
                <div class="column-title-income">รายรับ</div>
                <div class="transaction-list" id="incomeList"></div>
            </div>
            <!-- ฝั่งรายจ่าย -->
            <div class="column-box">
                <div class="column-title-expense">รายจ่าย</div>
                <div class="transaction-list" id="expenseList"></div>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('pro_expense_db_v2')) || {};
        let currentMonth = getCurrentMonthKey();
        let myChart = null;
        let activeTab = 'expense';
        let currentFilter = 'all';

        function getCurrentMonthKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        }

        function initApp() {
            generateMonthOptions();
            checkAndCopyFixedItems();
            renderData();
        }

        function generateMonthOptions() {
            const select = document.getElementById('currentMonthSelect');
            select.innerHTML = '';
            const d = new Date();
            for (let i = -6; i <= 6; i++) {
                const targetDate = new Date(d.getFullYear(), d.getMonth() + i, 1);
                const val = `${targetDate.getFullYear()}-${String(targetDate.getMonth() + 1).padStart(2, '0')}`;
                const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
                const label = `${thaiMonths[targetDate.getMonth()]} ${targetDate.getFullYear() + 543}`;
                const opt = document.createElement('option');
                opt.value = val;
                opt.textContent = label;
                if (val === currentMonth) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function changeMonth() {
            currentMonth = document.getElementById('currentMonthSelect').value;
            checkAndCopyFixedItems();
            renderData();
        }

        function checkAndCopyFixedItems() {
            if (!db[currentMonth]) {
                db[currentMonth] = [];
                const [year, month] = currentMonth.split('-').map(Number);
                const prevDate = new Date(year, month - 2, 1);
                const prevMonthKey = `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;
                
                if (db[prevMonthKey]) {
                    const fixedItems = db[prevMonthKey].filter(item => item.isFixed);
                    db[currentMonth] = fixedItems.map(item => ({
                        ...item,
                        id: Date.now() + Math.random(),
                        status: item.type === 'income' ? 'not-received' : 'pending'
                    }));
                }
                saveDB();
            }
        }

        function setFormType(type) {
            activeTab = type;
            document.getElementById('formType').value = type;
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(b => b.classList.remove('active'));
            if(type === 'expense') btns[0].classList.add('active');
            else btns[1].classList.add('active');
        }

        function setFilter(filter, el) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            renderData();
        }

        function addTransaction(e) {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const note = document.getElementById('note').value;
            const type = document.getElementById('formType').value;
            const status = type === 'income' ? 'not-received' : 'pending';
            const isFixed = document.getElementById('isFixed').checked;

            if (!db[currentMonth]) db[currentMonth] = [];

            db[currentMonth].push({
                id: Date.now(),
                title,
                amount,
                note,
                type,
                status,
                isFixed
            });

            saveDB();
            renderData();
            document.getElementById('transactionForm').reset();
            setFormType('expense');
        }

        function toggleStatus(id) {
            const items = db[currentMonth] || [];
            const item = items.find(i => i.id === id);
            if (item) {
                if (item.type === 'income') {
                    if (item.status === 'not-received') item.status = 'received';
                    else if (item.status === 'received') item.status = 'partial-received';
                    else item.status = 'not-received';
                } else {
                    if (item.status === 'pending') item.status = 'paid';
                    else if (item.status === 'paid') item.status = 'partial';
                    else item.status = 'pending';
                }
                saveDB();
                renderData();
            }
        }

        function deleteTransaction(id) {
            db[currentMonth] = db[currentMonth].filter(item => item.id !== id);
            saveDB();
            renderData();
        }

        function saveDB() {
            localStorage.setItem('pro_expense_db_v2', JSON.stringify(db));
        }

        function renderData() {
            const items = db[currentMonth] || [];
            let totalInc = 0;
            let totalExp = 0;

            const incomeListEl = document.getElementById('incomeList');
            const expenseListEl = document.getElementById('expenseList');
            incomeListEl.innerHTML = '';
            expenseListEl.innerHTML = '';

            let hasIncome = false;
            let hasExpense = false;

            items.forEach(item => {
                if (item.type === 'income') totalInc += item.amount;
                else totalExp += item.amount;

                // ตรวจสอบเงื่อนไข Filter
                if (currentFilter === 'pending' && item.status !== 'pending' && item.status !== 'not-received') return;
                if (currentFilter === 'completed' && item.status !== 'paid' && item.status !== 'received') return;
                if (currentFilter === 'partial' && item.status !== 'partial' && item.status !== 'partial-received') return;

                const div = document.createElement('div');
                div.className = 'transaction-item';

                let statusClass = '';
                let statusText = '';

                if (item.type === 'income') {
                    hasIncome = true;
                    if (item.status === 'received') { statusClass = 'status-received'; statusText = 'รับแล้ว'; }
                    else if (item.status === 'not-received') { statusClass = 'status-not-received'; statusText = 'ยังไม่รับ'; }
                    else { statusClass = 'status-partial-received'; statusText = 'รับไม่ครบ'; }

                    div.innerHTML = `
                        <div class="transaction-info">
                            <h4>${item.title} ${item.isFixed ? '🔁' : ''}</h4>
                            ${item.note ? `<div class="transaction-note">${item.note}</div>` : ''}
                            <button class="status-btn ${statusClass}" onclick="toggleStatus(${item.id})">${statusText}</button>
                        </div>
                        <div class="transaction-right">
                            <span class="amount-income">+${item.amount.toLocaleString('th-TH', {minimumFractionDigits: 2})}</span>
                            <button class="delete-btn" onclick="deleteTransaction(${item.id})">ลบ</button>
                        </div>
                    `;
                    incomeListEl.appendChild(div);
                } else {
                    hasExpense = true;
                    if (item.status === 'paid') { statusClass = 'status-paid'; statusText = 'จ่ายแล้ว'; }
                    else if (item.status === 'pending') { statusClass = 'status-pending'; statusText = 'ยังไม่จ่าย'; }
                    else { statusClass = 'status-partial'; statusText = 'จ่ายไม่ครบ'; }

                    div.innerHTML = `
                        <div class="transaction-info">
                            <h4>${item.title} ${item.isFixed ? '🔁' : ''}</h4>
                            ${item.note ? `<div class="transaction-note">${item.note}</div>` : ''}
                            <button class="status-btn ${statusClass}" onclick="toggleStatus(${item.id})">${statusText}</button>
                        </div>
                        <div class="transaction-right">
                            <span class="amount-expense">-${item.amount.toLocaleString('th-TH', {minimumFractionDigits: 2})}</span>
                            <button class="delete-btn" onclick="deleteTransaction(${item.id})">ลบ</button>
                        </div>
                    `;
                    expenseListEl.appendChild(div);
                }
            });

            if (!hasIncome && incomeListEl.innerHTML === '') {
                incomeListEl.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 14px; padding: 20px;">ไม่มีรายการรายรับ</p>`;
            }
            if (!hasExpense && expenseListEl.innerHTML === '') {
                expenseListEl.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 14px; padding: 20px;">ไม่มีรายการรายจ่าย</p>`;
            }

            const net = totalInc - totalExp;
            document.getElementById('totalIncome').textContent = totalInc.toLocaleString('th-TH', {minimumFractionDigits: 2});
            document.getElementById('totalExpense').textContent = totalExp.toLocaleString('th-TH', {minimumFractionDigits: 2});
            
            const netEl = document.getElementById('netBalance');
            netEl.textContent = net.toLocaleString('th-TH', {minimumFractionDigits: 2});
            netEl.style.color = net >= 0 ? '#38bdf8' : '#fb923c';

            updateChart(totalInc, totalExp);
        }

        function updateChart(income, expense) {
            const ctx = document.getElementById('myChart').getContext('2d');
            if (myChart) myChart.destroy();

            const dataVals = (income === 0 && expense === 0) ? [1] : [income, expense];
            const bgColors = (income === 0 && expense === 0) ? ['#334155'] : ['#38bdf8', '#fb923c'];

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: (income === 0 && expense === 0) ? ['ไม่มีข้อมูล'] : ['รายรับ', 'รายจ่าย'],
                    datasets: [{ data: dataVals, backgroundColor: bgColors, borderWidth: 0 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#f8fafc', boxWidth: 12, font: { size: 14 } } }
                    },
                    cutout: '65%'
                }
            });
        }

        initApp();
    </script>
</body>
</html>
